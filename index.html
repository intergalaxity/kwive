<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwive</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/Tz517pW.png">
    <style>
        body {
            background-color: #1976d2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
        }

        .fallback {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <img src="https://i.imgur.com/LNh9321.png" alt="Kwive Logo" onerror="this.style.display='none'; const span = document.createElement('span'); span.className='fallback'; span.innerText='Kwive'; this.parentNode.appendChild(span);">
</body>
</html>
